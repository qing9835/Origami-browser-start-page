<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF 工具 · 合并 / 拆分 / 重命名</title>
<link rel="icon" href="assets/favicon.svg">
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --line: #e6e8ec;
    --text: #1f2430;
    --muted: #9aa1ad;
    --accent: #94b86a;
    --accent-soft: rgba(148,184,106,0.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; flex-direction: column; align-items: center;
    padding: 24px 24px 60px; color: var(--text);
    background: var(--bg); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
      "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { width: 100%; max-width: 880px; }

  /* 头部 */
  .head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 22px; }
  .head h1 { font-size: 22px; font-weight: 700; letter-spacing: 0.01em; margin: 0; }
  .badge-btn {
    border: 1px solid var(--line); background: var(--card); color: var(--muted);
    font-size: 12px; padding: 6px 12px; border-radius: 999px; cursor: default;
    transition: color .15s ease, border-color .15s ease;
  }
  .badge-btn:hover { color: var(--accent); border-color: var(--accent); }

  /* 功能选择（合并 / 拆分 / 重命名） */
  .funcline { margin-bottom: 16px; }
  .seg { display: flex; gap: 8px; }
  .seg-btn {
    flex: 1; padding: 10px; border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: 600;
    border: 1px solid var(--line); background: var(--card); color: var(--muted);
    transition: all .15s ease;
  }
  .seg-btn:hover { border-color: var(--accent); color: var(--text); }
  .seg-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* 卡片 */
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    padding: 18px 20px; box-shadow: 0 6px 24px rgba(20,30,60,0.04);
  }
  .card + .card, .panel .card + .resblock { margin-top: 16px; }

  /* 拖拽上传区 */
  .drop-zone {
    border: 1.5px dashed var(--line); border-radius: 12px;
    padding: 40px 20px; text-align: center; cursor: pointer;
    transition: border-color .2s ease, background .2s ease;
  }
  .drop-zone:hover, .drop-zone.dragover { border-color: var(--accent); background: var(--accent-soft); }
  .dz-icon { color: #c3c9d4; margin-bottom: 10px; }
  .dz-title { font-size: 15px; font-weight: 600; color: var(--text); margin: 0 0 4px; }
  .dz-sub { font-size: 12px; color: var(--muted); margin: 0; line-height: 1.6; }

  /* 文件已选择提示 */
  .file-picked {
    display: flex; align-items: center; gap: 6px; margin: 12px 2px 0;
    font-size: 13px; color: var(--text); background: #fafbfc;
    border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px;
  }
  .file-picked .fp-ico { color: var(--accent); flex: none; }
  .file-picked .fp-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* 字段 */
  .field { display: flex; flex-direction: column; gap: 6px; margin-top: 14px; }
  .field label { font-size: 12px; color: var(--muted); }
  .field input {
    padding: 10px 12px; font-size: 13px; color: var(--text);
    background: #fafbfc; border: 1px solid var(--line); border-radius: 10px; outline: none;
  }
  .field input:focus { border-color: var(--accent); }
  .hint { font-size: 12px; color: var(--muted); line-height: 1.6; }

  /* 开关 */
  .switch { width: 44px; height: 24px; border-radius: 999px; background: #d1d5db; position: relative; transition: background .2s; cursor: pointer; flex-shrink: 0; }
  .switch.on { background: var(--accent); }
  .switch .knob { width: 20px; height: 20px; border-radius: 50%; background: #fff; position: absolute; top: 2px; left: 2px; transition: left .2s; box-shadow: 0 1px 2px rgba(0,0,0,0.2); }
  .switch.on .knob { left: 22px; }
  .option-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 14px; }
  .option-row .opt-title { font-size: 13px; font-weight: 600; color: var(--text); margin: 0 0 2px; }
  .option-row .hint { margin: 0; }

  /* 操作行 */
  .actions { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; gap: 8px; }
  .actions .spacer { flex: 1; }
  .status { font-size: 12px; color: var(--muted); }
  .primary {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; flex: none;
    padding: 10px 24px; border: 0; border-radius: 10px; cursor: pointer;
    background: var(--accent); color: #fff; font-size: 14px; font-weight: 600; line-height: 1;
    transition: background .15s ease, transform .12s ease, box-shadow .15s ease;
  }
  .primary:hover { background: #86a95e; box-shadow: 0 4px 14px rgba(148,184,106,0.30); }
  .primary:active { transform: scale(0.97); }
  .primary:disabled { opacity: .55; cursor: not-allowed; box-shadow: none; }
  .ghost {
    padding: 9px 18px; border: 1px solid var(--line); background: var(--card);
    color: var(--muted); font-size: 13px; font-weight: 600; border-radius: 10px; cursor: pointer;
    transition: color .15s ease, border-color .15s ease;
  }
  .ghost:hover { color: var(--text); border-color: var(--accent); }

  /* 文件列表（合并） */
  .listlabel { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .file-list { margin-top: 10px; }
  .file-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 6px; border-top: 1px solid var(--line); }
  .file-item:first-child { border-top: 0; }
  .file-item:hover { background: #fafbfc; }
  .file-idx { width: 26px; height: 26px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 700; display: grid; place-items: center; flex: none; }
  .file-name { flex: 1; min-width: 0; font-size: 13px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-size { font-size: 12px; color: var(--muted); flex: none; }
  .file-ops { display: flex; align-items: center; gap: 6px; flex: none; }
  .mv-btn {
    width: 24px; height: 16px; border: 0; border-radius: 5px; background: #f0f2f5; color: #7b8291;
    font-size: 9px; cursor: pointer; display: grid; place-items: center; transition: background .15s ease, color .15s ease;
  }
  .mv-btn:hover:not(:disabled) { background: var(--accent-soft); color: var(--accent); }
  .mv-btn:disabled { opacity: .3; cursor: not-allowed; }
  .del-btn { width: 26px; height: 26px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); cursor: pointer; display: grid; place-items: center; transition: color .15s ease, background .15s ease; }
  .del-btn:hover { color: #d93025; background: rgba(217,48,37,0.08); }

  /* 提示（文件过大等） */
  .tip { display: block; font-size: 12px; text-align: center; padding: 8px 10px; border-radius: 8px; margin-top: 10px; }
  .tip-err { background: rgba(217,48,37,0.08); color: #d93025; }
  .tip-warn { background: rgba(217,153,0,0.10); color: #b26a00; }

  /* 结果区 */
  .result {
    position: relative; margin-top: 16px; min-height: 110px;
    padding: 18px; border-radius: 14px;
    background: #fafbfc; border: 1px solid var(--line);
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  }
  .result .r-ico { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; margin-bottom: 10px; }
  .result .r-title { font-size: 14px; font-weight: 600; margin: 0 0 4px; }
  .result .r-name { font-size: 12px; color: var(--muted); margin: 0 0 12px; word-break: break-all; }
  .result .ghost { flex: none; }

  /* 拆分结果列表 */
  .resblock { margin-top: 16px; }
  .res-list { display: flex; flex-direction: column; gap: 8px; }
  .res-item {
    display: flex; align-items: center; gap: 10px;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 14px; transition: border-color .15s ease;
  }
  .res-item:hover { border-color: var(--accent); }
  .res-icon { width: 28px; height: 28px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
  .res-info { flex: 1; min-width: 0; }
  .res-name { font-size: 13px; font-weight: 600; margin: 0; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .res-sub { font-size: 11px; color: var(--muted); margin: 2px 0 0; }
  .dl-btn {
    flex: none; padding: 7px 14px; border: 1px solid var(--line); background: var(--card);
    color: var(--muted); font-size: 12px; font-weight: 600; border-radius: 9px; cursor: pointer;
    transition: color .15s ease, border-color .15s ease;
  }
  .dl-btn:hover { color: var(--accent); border-color: var(--accent); }

  /* 加载 */
  .loading { display: none; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; margin-top: 14px; }
  .spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 底部 */
  .foot { text-align: center; font-size: 12px; color: var(--muted); margin-top: 28px; }

  .hidden { display: none !important; }

  /* Toast */
  .toast { position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%); background: rgba(17,24,39,.92); color: #fff; padding: 10px 20px; border-radius: 999px; font-size: 14px; z-index: 50; opacity: 0; transition: opacity .25s; pointer-events: none; max-width: 80vw; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <h1>PDF 工具</h1>
      <span class="badge-btn" title="文件只在你的浏览器内处理，不会上传到任何服务器">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px;margin-right:4px"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        本地处理
      </span>
    </div>

    <!-- 功能选择 -->
    <div class="funcline">
      <div class="seg">
        <button type="button" class="seg-btn active" data-tab="merge">合并</button>
        <button type="button" class="seg-btn" data-tab="split">拆分</button>
        <button type="button" class="seg-btn" data-tab="rename">重命名</button>
      </div>
    </div>

    <!-- ============ 合并 ============ -->
    <section id="panel-merge" class="panel">
      <div class="card">
        <div id="mergeDrop" class="drop-zone">
          <svg class="dz-icon" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
          <p class="dz-title">选择 PDF 文件</p>
          <p class="dz-sub">点击选择本地 PDF 文件 · 可多选，至少 2 个（最多 20 个）</p>
          <input type="file" id="mergeInput" accept=".pdf,application/pdf" multiple class="hidden">
        </div>

        <div id="mergeFileSection" class="hidden">
          <div class="listlabel" style="margin-top:12px">
            <span id="mergeCount">已选择 0 个文件</span>
            <span id="mergeSize"></span>
          </div>
          <div id="mergeSizeTip" class="hidden"></div>
          <div id="mergeList" class="file-list"></div>
        </div>

        <div id="mergeAction" class="hidden">
          <div class="field">
            <label>文件命名（可选）</label>
            <input type="text" id="mergeName" maxlength="50" placeholder="默认为 合并文件.pdf" autocomplete="off">
          </div>
          <div class="actions">
            <button type="button" id="mergeBtn" class="primary">合并</button>
            <span class="spacer"></span>
            <span class="status">合并后自动下载</span>
          </div>
        </div>
      </div>

      <div id="mergeResult" class="result hidden">
        <div class="r-ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
        <p class="r-title">合并完成</p>
        <p class="r-name" id="mergeResultName"></p>
        <button type="button" class="ghost" onclick="downloadResult('merge')">下载文件</button>
      </div>
    </section>

    <!-- ============ 拆分 ============ -->
    <section id="panel-split" class="panel hidden">
      <div class="card">
        <div id="splitDrop" class="drop-zone">
          <svg class="dz-icon" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
          <p class="dz-title">选择 PDF 文件</p>
          <p class="dz-sub" id="splitPickHint">点击选择本地 PDF 文件</p>
          <input type="file" id="splitInput" accept=".pdf,application/pdf" class="hidden">
        </div>
        <p class="file-picked hidden" id="splitFileName">
          <svg class="fp-ico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
          <span class="fp-name" id="splitFileNameText"></span>
        </p>

        <div class="field">
          <label>页码范围</label>
          <input type="text" id="splitRange" placeholder="如 1-3 或 1，3-5，7" autocomplete="off">
          <p class="hint">中英文逗号皆可，如 1-3，5 表示第 1~3 页和第 5 页；可倒序（3-1），可重复。</p>
        </div>

        <div class="option-row">
          <div>
            <p class="opt-title">合并为单个文件</p>
            <p class="hint">关闭后每个页码范围单独生成一个 PDF</p>
          </div>
          <div class="switch on" id="splitMergeSwitch"><div class="knob"></div></div>
        </div>

        <div class="field">
          <label id="splitNameLabel">文件命名（可选）</label>
          <input type="text" id="splitName" maxlength="50" placeholder="默认为 拆分文件.pdf" autocomplete="off">
        </div>

        <div class="actions">
          <button type="button" id="splitBtn" class="primary" disabled>拆分</button>
          <span class="spacer"></span>
          <span class="status">输出 <span id="splitResultCount">0</span> 个文件</span>
        </div>
      </div>

      <div id="splitResult" class="resblock hidden">
        <div class="listlabel">拆分结果</div>
        <div id="splitResultList" class="res-list"></div>
      </div>
    </section>

    <!-- ============ 重命名 ============ -->
    <section id="panel-rename" class="panel hidden">
      <div class="card">
        <div id="renameDrop" class="drop-zone">
          <svg class="dz-icon" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
          <p class="dz-title">选择 PDF 文件</p>
          <p class="dz-sub">点击选择本地 PDF 文件</p>
          <input type="file" id="renameInput" accept=".pdf,application/pdf" class="hidden">
        </div>
        <p class="file-picked hidden" id="renameFileName">
          <svg class="fp-ico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
          <span class="fp-name" id="renameFileNameText"></span>
        </p>

        <div class="field">
          <label>新文件名</label>
          <input type="text" id="renameNew" maxlength="100" placeholder="请输入新的文件名（不含扩展名）" autocomplete="off">
        </div>

        <div class="actions">
          <button type="button" id="renameBtn" class="primary" disabled>下载重命名文件</button>
          <span class="spacer"></span>
          <span class="status">不修改原文件</span>
        </div>
      </div>
    </section>

    <p class="foot">所有处理均在浏览器本地完成，文件不会上传</p>
  </div>

  <div class="toast" id="toast"></div>

  <script src="assets/pdf-lib.min.js"></script>
  <script>
  /* ============================================================
     PDF 工具 · 纯前端版（合并 / 拆分 / 重命名）
     - 全部在浏览器本地处理（pdf-lib），文件不上传
     ============================================================ */
  const { PDFDocument } = PDFLib;

  /* ---------- 通用 ---------- */
  const $ = (id) => document.getElementById(id);
  let mergeResult = null;      // { blob, name }
  let splitResults = [];       // [{ blob, name }]

  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), 2800);
  }

  function fmtBytes(b) {
    if (!b) return '0 B';
    const k = 1024, units = ['B', 'KB', 'MB', 'GB'];
    const i = Math.min(units.length - 1, Math.floor(Math.log(b) / Math.log(k)));
    return (b / Math.pow(k, i)).toFixed(1) + ' ' + units[i];
  }

  // 对齐后端 getSafeFilename：去非法字符 / .. / .pdf，截 80 字符
  function sanitizeName(name) {
    let s = String(name || '').trim().replace(/[\\/:*?"<>|]/g, '').replace(/\.\./g, '');
    s = s.replace(/\.pdf$/i, '');
    if (s.length > 80) s = s.slice(0, 80);
    return s;
  }

  function readAsArrayBuffer(file) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = () => reject(new Error('读取文件失败'));
      r.readAsArrayBuffer(file);
    });
  }

  async function loadPdf(bytes) {
    try {
      return await PDFDocument.load(bytes, { ignoreEncryption: true });
    } catch (e) {
      throw new Error('无法解析 PDF（文件可能已损坏或加密）');
    }
  }

  function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  }

  function downloadResult(kind) {
    if (kind === 'merge' && mergeResult) downloadBlob(mergeResult.blob, mergeResult.name);
    if (kind === 'split') splitResults.forEach(r => downloadBlob(r.blob, r.name));
  }

  /* ---------- 拖拽选择（三个面板通用） ---------- */
  function bindDropZone(dropId, inputId, onChange) {
    const drop = $(dropId), input = $(inputId);
    drop.addEventListener('click', () => input.click());
    input.addEventListener('change', () => {
      if (input.files && input.files.length) { onChange(input.files); input.value = ''; }
    });
    ['dragover', 'dragenter'].forEach(ev => drop.addEventListener(ev, (e) => {
      e.preventDefault(); drop.classList.add('dragover');
    }));
    ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, (e) => {
      e.preventDefault(); drop.classList.remove('dragover');
    }));
    drop.addEventListener('drop', (e) => {
      const fs = e.dataTransfer && e.dataTransfer.files;
      if (fs && fs.length) onChange(fs);
    });
  }

  /* ============================================================
     1. 合并
     ============================================================ */
  const MAX_TOTAL = 100 * 1024 * 1024;   // 100MB
  const WARN_TOTAL = 50 * 1024 * 1024;   // 50MB
  const mergeFiles = [];                 // [{ file, name, size }]

  function updateMergeList() {
    const total = mergeFiles.reduce((s, f) => s + f.size, 0);
    $('mergeFileSection').classList.toggle('hidden', mergeFiles.length === 0);
    $('mergeAction').classList.toggle('hidden', mergeFiles.length < 2 || total > MAX_TOTAL);
    $('mergeCount').textContent = `已选择 ${mergeFiles.length} 个文件`;
    $('mergeSize').textContent = mergeFiles.length ? `（${fmtBytes(total)}）` : '';
    mergeResult = null;
    $('mergeResult').classList.add('hidden');

    const tip = $('mergeSizeTip');
    if (total > MAX_TOTAL) {
      tip.className = 'tip tip-err';
      tip.textContent = '文件总大小超过 100 MB，无法处理';
    } else if (total > WARN_TOTAL) {
      tip.className = 'tip tip-warn';
      tip.textContent = '文件过大，处理会变慢';
    } else {
      tip.className = 'hidden';
    }

    const list = $('mergeList');
    list.innerHTML = '';
    mergeFiles.forEach((f, i) => {
      const row = document.createElement('div');
      row.className = 'file-item';
      row.innerHTML = `
        <span class="file-idx">${i + 1}</span>
        <span class="file-name">${f.name.replace(/</g, '&lt;')}</span>
        <span class="file-size">${fmtBytes(f.size)}</span>
        <span class="file-ops">
          <span class="mv-col" style="display:flex;flex-direction:column;gap:3px">
            <button class="mv-btn" data-mv="-1" ${i === 0 ? 'disabled' : ''}>▲</button>
            <button class="mv-btn" data-mv="1" ${i === mergeFiles.length - 1 ? 'disabled' : ''}>▼</button>
          </span>
          <button class="del-btn" data-del="1" title="移除">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </span>`;
      row.querySelectorAll('[data-mv]').forEach(b => b.addEventListener('click', () => {
        const d = Number(b.dataset.mv), j = i + d;
        if (j < 0 || j >= mergeFiles.length) return;
        [mergeFiles[i], mergeFiles[j]] = [mergeFiles[j], mergeFiles[i]];
        updateMergeList();
      }));
      row.querySelector('[data-del]').addEventListener('click', () => {
        mergeFiles.splice(i, 1);
        updateMergeList();
      });
      list.appendChild(row);
    });
  }

  function addMergeFiles(fileList) {
    for (const f of fileList) {
      if (!/\.pdf$/i.test(f.name) && f.type !== 'application/pdf') { toast(`已跳过非 PDF：${f.name}`); continue; }
      if (mergeFiles.length >= 20) { toast('最多选择 20 个文件'); break; }
      mergeFiles.push({ file: f, name: f.name, size: f.size });
    }
    updateMergeList();
  }

  async function doMerge() {
    if (mergeFiles.length < 2) return toast('至少需要 2 个 PDF 文件');
    const btn = $('mergeBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>合并中…';

    try {
      const out = await PDFDocument.create();
      for (let i = 0; i < mergeFiles.length; i++) {
        btn.innerHTML = `<span class="spinner"></span>合并中 ${i + 1}/${mergeFiles.length}…`;
        const src = await loadPdf(await readAsArrayBuffer(mergeFiles[i].file));
        const pages = await out.copyPages(src, src.getPageIndices());
        pages.forEach(p => out.addPage(p));
      }
      const bytes = await out.save();
      const name = sanitizeName($('mergeName').value.trim()) || '合并文件';
      mergeResult = { blob: new Blob([bytes], { type: 'application/pdf' }), name: name + '.pdf' };
      $('mergeResultName').textContent = mergeResult.name;
      $('mergeResult').classList.remove('hidden');
      toast('合并成功');
    } catch (e) {
      toast(e.message || '合并失败');
    } finally {
      btn.disabled = false;
      btn.textContent = '合并';
    }
  }

  /* ============================================================
     2. 拆分
     ============================================================ */
  let splitFile = null;   // { file, name, size }
  let splitPageCount = 0;

  // 解析页码范围 → 0-based 页索引数组（保持顺序，允许倒序/重复）
  function parseRanges(text, totalPages) {
    const s = String(text).replace(/，/g, ',').replace(/[\s　]+/g, '').trim();
    if (!s) throw new Error('请输入页码范围');
    if (!/^\d+([-,]\d+)*$/.test(s)) throw new Error('页码范围格式错误，请使用如 "1-3" 或 "1,3-5"');
    const idx = [];
    for (const seg of s.split(',')) {
      if (!seg) continue;
      const parts = seg.split('-').map(Number);
      if (parts.length === 1) {
        idx.push(parts[0] - 1);
      } else {
        const [a, b] = parts;
        if (a === b) { idx.push(a - 1); continue; }
        const step = a < b ? 1 : -1;
        for (let p = a; p !== b + step; p += step) idx.push(p - 1);
      }
    }
    for (const i of idx) {
      if (i < 0 || i >= totalPages) throw new Error(`页码范围超出 PDF 总页数（共 ${totalPages} 页）`);
    }
    return idx;
  }

  function splitRangeGroup(segs, totalPages) {
    // 每个 seg（如 "1-3" / "5"）→ 0-based 页索引数组
    const out = [];
    for (const seg of segs) {
      const m = seg.match(/^(\d+)(?:-(\d+))?$/);
      if (!m) continue;
      const a = +m[1], b = m[2] !== undefined ? +m[2] : a;
      const step = a <= b ? 1 : -1;
      const arr = [];
      for (let p = a; p !== b + step; p += step) {
        if (p < 1 || p > totalPages) throw new Error(`页码范围超出 PDF 总页数（共 ${totalPages} 页）`);
        arr.push(p - 1);
      }
      out.push({ seg: seg.replace(/[^\d-]/g, ''), pages: arr });
    }
    return out;
  }

  function updateSplitBtn() {
    $('splitBtn').disabled = !splitFile || !$('splitRange').value.trim();
  }

  async function doSplit() {
    if (!splitFile) return toast('请先选择 PDF 文件');
    const rangeText = $('splitRange').value.trim();
    const mergeAll = $('splitMergeSwitch').classList.contains('on');
    const btn = $('splitBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>拆分中…';

    try {
      const src = await loadPdf(await readAsArrayBuffer(splitFile.file));
      splitPageCount = src.getPageCount();
      const segs = rangeText.replace(/，/g, ',').split(',').map(s => s.trim()).filter(Boolean);
      const groups = splitRangeGroup(segs, splitPageCount);
      const safeName = sanitizeName($('splitName').value.trim()) || '拆分文件';
      splitResults = [];

      if (mergeAll) {
        const idx = [];
        groups.forEach(g => idx.push(...g.pages));
        if (!idx.length) throw new Error('没有有效的页码范围');
        const out = await PDFDocument.create();
        const pages = await out.copyPages(src, idx);
        pages.forEach(p => out.addPage(p));
        const bytes = await out.save();
        splitResults = [{ blob: new Blob([bytes], { type: 'application/pdf' }), name: safeName + '.pdf' }];
      } else {
        for (let i = 0; i < groups.length; i++) {
          const g = groups[i];
          if (!g.pages.length) continue;
          const out = await PDFDocument.create();
          const pages = await out.copyPages(src, g.pages);
          pages.forEach(p => out.addPage(p));
          const bytes = await out.save();
          splitResults.push({ blob: new Blob([bytes], { type: 'application/pdf' }), name: `${safeName}_${g.seg}.pdf` });
        }
        if (!splitResults.length) throw new Error('没有有效的页码范围');
      }

      $('splitResultCount').textContent = splitResults.length;
      const list = $('splitResultList');
      list.innerHTML = '';
      splitResults.forEach((r, i) => {
        const el = document.createElement('div');
        el.className = 'res-item';
        el.innerHTML = `
          <span class="res-icon">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          </span>
          <span class="res-info">
            <p class="res-name">${r.name.replace(/</g, '&lt;')}</p>
            <p class="res-sub">${fmtBytes(r.blob.size)}</p>
          </span>
          <button type="button" class="dl-btn" onclick="downloadBlob(splitResults[${i}].blob, splitResults[${i}].name)">下载</button>`;
        list.appendChild(el);
      });
      $('splitResult').classList.remove('hidden');
      toast('拆分成功');
    } catch (e) {
      toast(e.message || '拆分失败');
    } finally {
      btn.disabled = false;
      btn.textContent = '拆分';
      updateSplitBtn();
    }
  }

  /* ============================================================
     3. 重命名
     ============================================================ */
  let renameFile = null;   // { file, name, size }

  function updateRenameBtn() {
    $('renameBtn').disabled = !renameFile || !$('renameNew').value.trim();
  }

  async function doRename() {
    const name = $('renameNew').value.trim();
    if (!renameFile) return toast('请先选择 PDF 文件');
    if (!name) return toast('请输入新文件名');
    const finalName = sanitizeName(name.endsWith('.pdf') ? name : name + '.pdf') || '重命名';
    downloadBlob(renameFile.file, finalName + '.pdf');
    toast('已下载重命名文件');
  }

  /* ---------- 事件绑定 ---------- */
  // 功能切换
  document.querySelectorAll('.seg-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.panel').forEach(p => p.classList.add('hidden'));
      $('panel-' + btn.dataset.tab).classList.remove('hidden');
    });
  });
  document.querySelector('.seg-btn[data-tab="merge"]').classList.add('active');

  // 合并
  bindDropZone('mergeDrop', 'mergeInput', addMergeFiles);
  $('mergeBtn').addEventListener('click', doMerge);
  $('mergeName').addEventListener('input', () => { mergeResult = null; $('mergeResult').classList.add('hidden'); });

  // 拆分
  bindDropZone('splitDrop', 'splitInput', (fs) => {
    const f = fs[0];
    if (!f) return;
    splitFile = { file: f, name: f.name, size: f.size };
    $('splitFileName').classList.remove('hidden');
    $('splitFileNameText').textContent = f.name;
    $('splitResult').classList.add('hidden');
    toast('已选择文件');
    updateSplitBtn();
  });
  $('splitMergeSwitch').addEventListener('click', () => {
    $('splitMergeSwitch').classList.toggle('on');
    $('splitNameLabel').textContent = $('splitMergeSwitch').classList.contains('on') ? '文件命名（可选）' : '命名前缀（可选）';
    $('splitName').placeholder = $('splitMergeSwitch').classList.contains('on') ? '默认为 拆分文件.pdf' : '默认为 拆分文件';
  });
  $('splitRange').addEventListener('input', () => { $('splitResult').classList.add('hidden'); updateSplitBtn(); });
  $('splitName').addEventListener('input', () => $('splitResult').classList.add('hidden'));
  $('splitBtn').addEventListener('click', doSplit);

  // 重命名
  bindDropZone('renameDrop', 'renameInput', (fs) => {
    const f = fs[0];
    if (!f) return;
    renameFile = { file: f, name: f.name, size: f.size };
    $('renameFileName').classList.remove('hidden');
    $('renameFileNameText').textContent = f.name;
    toast('已选择文件');
    updateRenameBtn();
  });
  $('renameBtn').addEventListener('click', doRename);
  $('renameNew').addEventListener('input', updateRenameBtn);
  $('renameNew').addEventListener('keydown', (e) => { if (e.key === 'Enter') doRename(); });
  </script>
</body>
</html>
